; BioBridge firmware. Two nodes share lib/bbframe (frame encoder) and src/common (sender, sync input).
;   pio run -e node_a -t upload      ECG node (AD8232) over USB-serial
;   pio run -e node_b -t upload      PPG node (MAX30102) over BLE
;   pio run -e node_a_sim / node_b_sim   same firmware with on-board synthetic signals (bare ESP32 is enough)
;   pio run -e node_sync -t upload   sync-pulse rig for clock-sync ground truth (Paper 1)
;   pio run -e node_a_noprobe / node_b_noprobe   timing probes off, for the probe ablation
;   pio test -e native               frame encoder vs protocol/test-vectors (no board needed)

[platformio]
default_envs = node_a, node_b, node_sync

[esp32_base]
; Pinned: platform 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4). The timer and NimBLE callback APIs used
; here are the 2.x / NimBLE 1.4 ones; moving to Arduino-ESP32 3.x needs code changes.
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags = -Wall -Isrc

[env:node_a]
extends = esp32_base
build_src_filter = +<common/> +<node_a/>

[env:node_a_sim]
extends = env:node_a
build_flags = ${esp32_base.build_flags} -DSENSOR_SIM=1

[env:node_b]
extends = esp32_base
build_src_filter = +<common/> +<node_b/>
lib_deps = h2zero/NimBLE-Arduino@1.4.3

[env:node_b_sim]
extends = env:node_b
build_flags = ${esp32_base.build_flags} -DSENSOR_SIM=1

[env:node_a_noprobe]
extends = env:node_a
build_flags = ${esp32_base.build_flags} -DTIME_PROBES=0

[env:node_b_noprobe]
extends = env:node_b
build_flags = ${esp32_base.build_flags} -DTIME_PROBES=0

[env:node_sync]
extends = esp32_base
build_src_filter = +<common/> +<node_sync/>

[env:native]
platform = native
test_build_src = no
lib_compat_mode = off
